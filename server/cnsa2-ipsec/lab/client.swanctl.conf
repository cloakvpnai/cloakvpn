# CNSA 2.0 IPsec profile, client side (stands in for an app in the lab).
connections {
  cnsa2 {
    version = 2
    remote_addrs = cnsa2-gw
    vips = 0.0.0.0
    proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem1024
    rekey_time = 1h
    local {
      auth = pubkey
      certs = client.pem
      id = device1.lattice.lab
    }
    remote {
      auth = pubkey
      id = gw.lattice.lab
      cacerts = ca.pem
    }
    children {
      net {
        remote_ts = 10.99.0.0/24
        esp_proposals = aes256gcm16-mlkem1024
        rekey_time = 10m
      }
    }
  }
}
