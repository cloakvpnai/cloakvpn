# CNSA 2.0 IPsec profile (draft-guthrie-cnsa2-ipsec-profile-05), gateway side.
# IKE:  AES-256-GCM, PRF-HMAC-SHA-384, ECP-384 in IKE_SA_INIT,
#       ML-KEM-1024 as additional key exchange 1 (IKE_INTERMEDIATE).
# ESP:  AES-256-GCM; re-keys carry an ML-KEM-1024 exchange.
# Only these proposals are configured, so anything else is refused.
connections {
  cnsa2 {
    version = 2
    proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem1024
    rekey_time = 1h
    pools = clients
    local {
      auth = pubkey
      certs = gateway.pem
      id = gw.lattice.lab
    }
    remote {
      auth = pubkey
      cacerts = ca.pem
    }
    children {
      net {
        local_ts = 10.99.0.0/24
        esp_proposals = aes256gcm16-mlkem1024
        rekey_time = 10m
      }
    }
  }
}
pools {
  clients {
    addrs = 10.77.0.0/24
  }
}
